name: Proximity 67.61 research

on:
  push:
    branches:
      - research/proximity-6761-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout research harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch accepted 67.60 baseline and apply candidate
        run: |
          cp research/6761_mutate.py /tmp/6761_mutate.py
          git clone --filter=blob:none https://github.com/proximity-prize/proximity-prize.git /tmp/proximity
          cd /tmp/proximity
          git checkout 625f2c09c8ac826ba67c1f336b15348f87f52d4d
          python3 /tmp/6761_mutate.py /tmp/proximity
          git diff --check
          git diff --binary > /tmp/candidate-6761.patch

      - name: Install Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile arithmetic certificates
        working-directory: /tmp/proximity
        run: |
          lake env lean ProximityPrize/SubmissionLower/LocatorArithmetic.lean
          lake env lean ProximityPrize/SubmissionLower/LocatorScalarArithmetic.lean
          lake env lean ProximityPrize/SubmissionLower/LocatorReplacementData.lean

      - name: Compile exported solution
        working-directory: /tmp/proximity
        run: lake env lean ProximityPrize/SubmissionLower/Solution.lean

      - name: Canonical build
        working-directory: /tmp/proximity
        run: lake build

      - name: Axiom audit
        working-directory: /tmp/proximity
        run: lake env lean scripts/check-axioms.lean

      - name: Upload candidate patch
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: proximity-candidate-6761-${{ github.sha }}
          path: /tmp/candidate-6761.patch
          if-no-files-found: warn
